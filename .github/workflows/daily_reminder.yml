name: Daily Schedule Reminder

on:
  schedule:
    # ------------------------------------------------------------------
    # 6 AM FULL-DAY OVERVIEW window (the authoritative daily message).
    # GitHub Actions cron drifts, so we tick across the whole 6 AM ICT
    # hour; the script's state file guarantees exactly one overview/day.
    # 06:00 ICT = 23:00 UTC (previous day).
    # ------------------------------------------------------------------
    - cron: '0 23 * * *'    # 06:00 ICT
    - cron: '10 23 * * *'   # 06:10 ICT
    - cron: '20 23 * * *'   # 06:20 ICT
    - cron: '30 23 * * *'   # 06:30 ICT
    - cron: '40 23 * * *'   # 06:40 ICT
    - cron: '50 23 * * *'   # 06:50 ICT

    # ------------------------------------------------------------------
    # "5 minutes before" per-activity alerts (best-effort nudges).
    # UTC = ICT - 7h. Comment shows the ICT alert time -> activity start.
    # ------------------------------------------------------------------
    - cron: '55 21 * * *'   # 04:55 ICT -> 05:00 Wake up
    - cron: '25 22 * * *'   # 05:25 ICT -> 05:30 Workout
    - cron: '40 22 * * *'   # 05:40 ICT -> 05:45 Breakfast
    - cron: '55 22 * * *'   # 05:55 ICT -> 06:00 Shower & prep
    # 06:25 ICT alert -> 06:30 Commute is covered by the 6 AM window tick.
    # 06:55 ICT alert -> 07:00 Work start:
    # (23:00 UTC tick already runs for the overview; script also checks alerts)
    - cron: '55 4 * * *'    # 11:55 ICT -> 12:00 Lunch
    - cron: '55 5 * * *'    # 12:55 ICT -> 13:00 Work (evening)
    - cron: '55 8 * * *'    # 15:55 ICT -> 16:00 Market / go out
    - cron: '25 9 * * *'    # 16:25 ICT -> 16:30 Back to room / Cafe (Sun)
    - cron: '45 9 * * *'    # 16:45 ICT -> 16:50 Nap
    - cron: '35 10 * * *'   # 17:35 ICT -> 17:40 Workout
    - cron: '50 10 * * *'   # 17:50 ICT -> 17:55 Shower & wash
    - cron: '25 11 * * *'   # 18:25 ICT -> 18:30 Dinner
    - cron: '55 11 * * *'   # 18:55 ICT -> 19:00 Call Family / GF / Guitar
    - cron: '25 12 * * *'   # 19:25 ICT -> 19:30 Research & Coding
    - cron: '55 12 * * *'   # 19:55 ICT -> 20:00 Language Study
    - cron: '25 13 * * *'   # 20:25 ICT -> 20:30 Reading
    - cron: '55 13 * * *'   # 20:55 ICT -> 21:00 Sleep

  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run schedule script
        id: run_script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_reminder.py | tee script_output.txt

      - name: Commit updated state file
        run: |
          if grep -q "STATE_UPDATED=true" script_output.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last_sent_date.txt
            git commit -m "chore: mark daily overview sent [skip ci]" || echo "Nothing to commit"
            git push
          else
            echo "No state update this run; skipping commit."
          fi
